name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q

  lang-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check language key integrity
        run: python tools/check_language_keys.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      # S-047 도입 시점의 기존 위반 44건은 S-057에서 전량 정리됐다(0건 달성).
      # 이제 실제 차단 게이트다 — 새 위반이 들어오면 CI가 막는다.
      # 억제가 꼭 필요한 줄은 코드에 `# noqa: <규칙> - <사유>`로 남긴다(무근거 억제 금지).
      - name: Run ruff check
        run: ruff check .
