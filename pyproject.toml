[tool.ruff]
# 현행 코드 기준: 20,094줄 표본에서 p99=101자, 120자 초과는 13줄뿐(최댓값 188).
# 79/100자(코드 스타일 가이드 권장)를 그대로 적용하면 기존 코드에서만 200건 이상
# 위반이 발생해 신규 위반과 구분이 안 되므로, 현재 코드의 "이상치 꼬리"를 기준으로
# 120자로 설정한다(S-047). 장기적으로 100자로 좁히는 것은 별도 작업으로 다룬다.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 최소 시작 구성: pycodestyle(E, E501 라인 길이 포함) + pyflakes(F). 다른 룰셋은 이번 태스크 범위 밖.
select = ["E", "F"]
